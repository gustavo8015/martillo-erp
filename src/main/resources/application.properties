# Perfil por defecto: H2 en memoria -> permite correr y hacer el demo del Sprint Review
# sin necesidad de instalar/configurar PostgreSQL primero.
# Decision documentada en arc42 - Seccion 9 (Decisiones de Arquitectura).

spring.application.name=martillo-erp

spring.datasource.url=jdbc:h2:mem:martillodb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola web de H2 para inspeccionar datos en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080
