# Perfil de produccion: PostgreSQL (tecnologia seleccionada en el documento del proyecto).
# Para usarlo: mvn spring-boot:run -Dspring-boot.run.profiles=postgres
# Ajusta host/puerto/credenciales segun tu entorno.

# Las credenciales llegan por variable de entorno (Sprint 2): el repositorio
# no guarda contrasenas y el flujo de integracion continua lo verifica.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/martillo_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:martillo_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080
