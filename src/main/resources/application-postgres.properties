# Perfil de produccion: PostgreSQL (tecnologia seleccionada en el documento del proyecto).
# Para usarlo: mvn spring-boot:run -Dspring-boot.run.profiles=postgres
# Ajusta host/puerto/credenciales segun tu entorno.

spring.datasource.url=jdbc:postgresql://localhost:5432/martillo_db
spring.datasource.username=martillo_user
spring.datasource.password=change_me

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080
