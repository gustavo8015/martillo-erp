# Figura 4 del informe del Sprint 3. La contrasena no aparece en el archivo:
# se toma de un Secret, con el mismo criterio que la revision automatica de
# credenciales del flujo de integracion continua del Sprint 2.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: servicio-nomina
  namespace: martillo-erp
spec:
  replicas: 2
  selector:
    matchLabels: { app: servicio-nomina }
  template:
    metadata:
      labels: { app: servicio-nomina }
    spec:
      containers:
        - name: servicio-nomina
          image: martillo-erp/servicio-nomina:1.0.0
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: postgres
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://base-nomina:5432/martillo_nomina
            - name: SPRING_DATASOURCE_USERNAME
              value: martillo_nomina
            - name: DB_NOMINA_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-nomina, key: password }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-nomina, key: password }
            - name: SERVER_PORT
              value: "8081"
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            initialDelaySeconds: 20
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            initialDelaySeconds: 40
---
apiVersion: v1
kind: Service
metadata:
  name: servicio-nomina
  namespace: martillo-erp
spec:
  selector: { app: servicio-nomina }
  ports:
    - port: 80
      targetPort: 8081
