# Plantilla del Secret. Este archivo NO contiene credenciales: los valores se
# crean en el clúster con kubectl y nunca se escriben en el repositorio.
#
#   kubectl -n martillo-erp create secret generic db-principal \
#     --from-literal=password="$DB_PRINCIPAL_PASSWORD"
#   kubectl -n martillo-erp create secret generic db-nomina \
#     --from-literal=password="$DB_NOMINA_PASSWORD"
#   kubectl -n martillo-erp create secret generic recaptcha \
#     --from-literal=secreto="$RECAPTCHA_SECRETO"
apiVersion: v1
kind: Secret
metadata:
  name: db-nomina
  namespace: martillo-erp
type: Opaque
stringData:
  password: REEMPLAZAR_EN_EL_CLUSTER
